name: Build LARİ Mobile Android APK

on:
  push:
    branches:
      - feat/lari-mobile-superapp
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Capacitor Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Build LARİ Mobile Web Bundle
        env:
          VITE_DATA_MODE: local
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lari-mobile-superapp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
